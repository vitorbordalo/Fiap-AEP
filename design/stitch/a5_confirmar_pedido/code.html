</div>
<div class="flex flex-col justify-center min-w-0 flex-1">
<div class="flex items-center justify-between gap-space-xs mb-1">

<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-status-stored/15 text-status-stored font-label-sm text-[11px] font-medium shrink-0">

<span class="material-symbols-outlined text-[15px] text-text-secondary">meeting_room</span>

<span class="text-text-disabled mx-0.5">•</span>
<span class="text-text-secondary font-label-sm">#8492</span>
</div>
</div>
</div>
<!-- 2. Instructional text -->
<div class="mb-space-lg">
<p class="font-body-md text-[15px] text-text-secondary leading-snug">
      Confirme onde e quando você perdeu o item.
    </p>
</div>
<!-- 3. Form fields -->
<div class="flex flex-col gap-space-lg mb-space-xl">
<!-- Field 1: Sala -->
<div class="flex flex-col">
<label class="font-label-sm text-[11px] uppercase tracking-wider text-text-secondary font-medium mb-1.5">
        Sala onde você estava
      </label>
<button class="w-full h-[52px] bg-surface rounded-xl px-space-md flex items-center justify-between transition-colors active:bg-surface-elevated text-left" type="button">
<div class="flex items-center gap-space-sm min-w-0">
<span class="material-symbols-outlined text-text-secondary text-[20px]">door_front</span>
<span class="font-body-md text-text-primary text-[15px] font-medium">Sala 304</span>
</div>
<span class="material-symbols-outlined text-text-secondary text-[20px]">keyboard_arrow_down</span>
</button>
</div>
<!-- Field 2: Turma -->
<div class="flex flex-col">
<label class="font-label-sm text-[11px] uppercase tracking-wider text-text-secondary font-medium mb-1.5">

<button class="w-full h-[52px] bg-surface rounded-xl px-space-md flex items-center justify-between transition-colors active:bg-surface-elevated text-left" type="button">

<!-- 5. Bottom action button -->
<div class="pt-space-sm">
<button class="w-full h-[52px] bg-primary-container hover:bg-accent-pressed active:bg-accent-pressed text-text-primary rounded-xl font-label-md text-label-md font-medium flex items-center justify-center gap-space-xs shadow-md active:scale-[0.99] transition-all" id="submit-btn" type="button">
<span>Enviar pedido</span>

</button>

<!-- Success Toast Modal (Simulated Interaction) -->
<div class="fixed inset-x-margin bottom-6 z-50 bg-surface-elevated rounded-xl p-space-md shadow-2xl flex items-center gap-space-md opacity-0 pointer-events-none translate-y-3 transition-all duration-300" id="toast-success">
<div class="w-8 h-8 rounded-full bg-status-returned/15 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-status-returned text-[20px]">check_circle</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-md text-[14px] text-text-primary font-medium">Pedido enviado com sucesso!</p>
<p class="font-label-sm text-[12px] text-text-secondary truncate">Apresente sua identificação na Central.</p>
</div>
</div>
</div>
<script>
  (function() {
    const submitBtn = document.getElementById('submit-btn');
    const toast = document.getElementById('toast-success');
    const check = document.getElementById('ownership-check');

    if (submitBtn && toast) {
      submitBtn.addEventListener('click', () => {
        toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
        toast.classList.add('opacity-100', 'translate-y-0');

        setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
        }, 3200);
      });
    }

    if (check && submitBtn) {
      check.addEventListener('change', (e) => {
        if (!e.target.checked) {
          submitBtn.classList.add('opacity-50', 'pointer-events-none');
        } else {
          submitBtn.classList.remove('opacity-50', 'pointer-events-none');
        }
      });
    }
  })();
</script></main></body></html>
