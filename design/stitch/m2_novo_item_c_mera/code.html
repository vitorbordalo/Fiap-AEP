<!DOCTYPE html><html class="dark" lang="pt-BR" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;background-color:#131313;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "background": "#131313", "surface-container-lowest": "#0e0e0e", "primary-container": "#ff4f76", "tertiary-container": "#30a467", "tertiary": "#6ddc99", "inverse-primary": "#bd0045", "secondary": "#c8c6c6", "surface-tint": "#ffb2bb", "surface-container-low": "#1c1b1b", "status-returned": "#22C55E", "on-surface-variant": "#e5bcc0", "on-tertiary": "#00391e", "on-surface": "#e5e2e1", "on-tertiary-fixed": "#00210f", "on-primary-fixed": "#400012", "surface-dim": "#131313", "border": "#2E2E2E", "tertiary-fixed-dim": "#6ddc99", "status-archived": "#737373", "status-requested": "#F59E0B", "secondary-container": "#474747", "outline": "#ac888b", "text-primary": "#FFFFFF", "outline-variant": "#5c3f42", "on-error": "#690005", "accent-pressed": "#C10F4A", "on-primary-container": "#5a001d", "surface-variant": "#353534", "surface-container-high": "#2a2a2a", "primary-fixed": "#ffd9dd", "primary-fixed-dim": "#ffb2bb", "on-primary-fixed-variant": "#910033", "on-tertiary-fixed-variant": "#00522e", "status-stored": "#3B82F6", "primary": "#ffb2bb", "on-background": "#e5e2e1", "on-tertiary-container": "#003119", "inverse-on-surface": "#313030", "surface-elevated": "#242424", "on-error-container": "#ffdad6", "on-primary": "#670022", "error-container": "#93000a", "secondary-fixed-dim": "#c8c6c6", "surface-bright": "#3a3939", "on-secondary": "#303030", "secondary-fixed": "#e4e2e1", "on-secondary-fixed-variant": "#474747", "on-secondary-container": "#b6b5b4", "surface-container-highest": "#353534", "text-disabled": "#5C5C5C", "error": "#ffb4ab", "surface-container": "#201f1f", "text-secondary": "#A3A3A3", "inverse-surface": "#e5e2e1", "on-secondary-fixed": "#1b1c1c", "surface": "#1A1A1A", "tertiary-fixed": "#8af9b4" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "margin-desktop": "2rem", "gutter-desktop": "1.5rem", "space-lg": "1rem", "space-md": "0.75rem", "space-2xl": "2rem", "margin": "1.25rem", "space-xs": "0.25rem", "gutter": "1rem", "space-xl": "1.5rem", "space-3xl": "3rem" }, "fontFamily": { "headline-lg": ["Inter"], "label-sm": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Inter"] }, "fontSize": { "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }] } } } };</script></head><body class="bg-background text-on-surface antialiased"><main class="relative w-full min-h-screen bg-background"><div class="flex flex-col w-full relative select-none overflow-hidden pb-safe">
<!-- Immersive Live Camera Viewfinder Simulation -->
<div class="relative w-full aspect-[9/16] max-h-[820px] rounded-3xl overflow-hidden bg-surface-container-lowest shadow-2xl flex flex-col justify-between">
<!-- Camera Feed Background (Simulated Realistic Classroom Desk Context) -->
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 scale-105" data-alt="First-person smartphone camera viewfinder perspective looking down at a sleek modern academic classroom desk made of dark charcoal wood. In the soft-focus background are modern FIAP laboratory chairs and ambient studio lighting with deep graphite tones, cinematic soft focus and realistic lens texture." id="camera-feed" style="background-image: url(&quot;https://lh3.googleusercontent.com/aida/AEtjO1V0lrKDoz4_lTybdDBTJKoepjQeq66Yphu2ANnyCnyYMNIX3MzD5aQNNG2ug4gfe4NGZFo19ZQVYAVpi7DLyHHnwt8qJftWQ9eLGik0MfTVFf7Ny7AQ3VsEezYx8icWclvIgA71hIFYP9nDVnG-SPK27n-YSo3nUjjSmb66oCwQmov1GFnpnIYxLzpnG1r58ricOFvi6kAdbWiea8rHURMaP7obcLNIj1EH_jB71wW1U1WXlxePw3rIC4A&quot;);"></div>
<!-- Vignette and Dark Tint Overlays for legibility -->
<div class="absolute inset-0 bg-gradient-to-b from-background/90 via-transparent to-background/95 pointer-events-none"></div>
<!-- Rule of Thirds Rule Grid (Subtle) -->
<div class="absolute inset-0 grid grid-cols-3 grid-rows-3 pointer-events-none opacity-20">
<div class="border-r border-b border-white/20"></div>
<div class="border-r border-b border-white/20"></div>
<div class="border-b border-white/20"></div>
<div class="border-r border-b border-white/20"></div>
<div class="border-r border-b border-white/20"></div>
<div class="border-b border-white/20"></div>
<div class="border-r border-white/20"></div>
<div class="border-r border-white/20"></div>
<div></div>
</div>
<!-- Top Bar / Step Tracker -->
<header class="relative z-20 w-full px-margin pt-4 flex items-center justify-between"><button aria-label="Voltar" class="w-11 h-11 rounded-full bg-surface-elevated/80 backdrop-blur-md flex items-center justify-center text-text-primary active:scale-90 transition-all hover:bg-surface-elevated" id="btn-back" type="button">
  <span class="material-symbols-outlined text-text-primary text-[22px]">arrow_back</span>
</button>
<div class="flex flex-col items-center">
  <h1 class="text-text-primary font-headline-sm text-[16px] tracking-tight font-semibold drop-shadow-sm">
    Novo item
  </h1>
</div>
<div class="flex items-center justify-end w-11"></div></header>
<!-- Center Stage: Frame Guide & Smart Bounding Box -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center px-6">
<!-- Guiding Prompt Capsule -->
<div class="mb-4 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-lowest/85 backdrop-blur-md shadow-lg animate-bounce">
<span class="material-symbols-outlined text-primary text-[18px]">center_focus_strong</span>
<p class="text-text-primary font-label-md text-[13px] font-medium tracking-wide">
          Enquadre o objeto encontrado
        </p>
</div>
<!-- Framing Box Container -->
<div class="relative w-64 h-64 sm:w-72 sm:h-72 rounded-[28px] flex items-center justify-center transition-all duration-300" id="reticle-box">
<!-- Framing Corner Brackets (High-contrast precision markers) -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-[3px] border-l-[3px] border-primary-container rounded-tl-[24px]"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-[3px] border-r-[3px] border-primary-container rounded-tr-[24px]"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-[3px] border-l-[3px] border-primary-container rounded-bl-[24px]"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-[3px] border-r-[3px] border-primary-container rounded-br-[24px]"></div>
<!-- Subtle Interior Glow & Soft Perimeter -->
<div class="absolute inset-0 rounded-[28px] border border-white/10 bg-surface/5"></div>
<!-- Pulsing Focus Reticle in the exact center -->
<div class="relative flex items-center justify-center pointer-events-none">
<div class="w-12 h-12 rounded-full border border-primary/40 flex items-center justify-center animate-ping"></div>
<div class="absolute w-6 h-6 rounded-full border-2 border-primary-container flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-primary-container"></div>
</div>
<!-- Fine Crosshairs -->
<div class="absolute -top-3 w-[1.5px] h-2 bg-primary-container/80"></div>
<div class="absolute -bottom-3 w-[1.5px] h-2 bg-primary-container/80"></div>
<div class="absolute -left-3 h-[1.5px] w-2 bg-primary-container/80"></div>
<div class="absolute -right-3 h-[1.5px] w-2 bg-primary-container/80"></div>
</div>
<!-- Object Detected Preview Pill (Appears when focused) -->

</div>
<!-- Quick Tips Indicator below Frame -->

</div>
<!-- Bottom Controls Area: High-contrast ergonomic thumb-zone -->
<div class="relative z-20 w-full px-margin pb-6 pt-3 bg-gradient-to-t from-background via-surface-container-lowest/90 to-transparent">
<!-- Controls Layout Grid (Gallery - Shutter - Flash) -->
<div class="flex items-center justify-around max-w-sm mx-auto"><div class="w-14"></div>
<div class="flex flex-col items-center">
  <button aria-label="Tirar foto do objeto" class="relative w-20 h-20 rounded-full flex items-center justify-center group transition-transform active:scale-95" id="shutter-button" type="button">
    <div class="absolute inset-0 rounded-full border-[3px] border-white transition-transform duration-200 group-hover:scale-105 shadow-2xl"></div>
    <div class="w-16 h-16 rounded-full flex items-center justify-center shadow-md transition-all group-active:scale-90" style="background-color: #ED145B;">
      <span class="material-symbols-outlined text-white text-[24px] opacity-90">photo_camera</span>
    </div>
  </button>
</div>
<div class="flex flex-col items-center gap-1.5">
  <button aria-label="Alternar modo de flash" class="w-14 h-14 rounded-full bg-surface-elevated/90 backdrop-blur-md flex items-center justify-center text-text-primary active:scale-95 transition-all shadow-lg hover:bg-surface-bright group border border-white/10" id="btn-flash" type="button">
    <span class="material-symbols-outlined text-text-secondary group-hover:text-text-primary transition-colors text-[24px]" id="flash-icon">flash_auto</span>
  </button>
  <span class="text-text-secondary font-label-sm text-[12px] font-medium tracking-wide" id="flash-label">Auto</span>
</div></div>
<!-- Quick Feedback Toast (Hidden by default, triggered on shutter tap) -->
<div class="hidden mt-4 mx-auto max-w-xs items-center justify-center gap-2 py-2 px-4 rounded-full bg-surface-elevated text-text-primary shadow-xl animate-fade-in" id="toast-capture">
<span class="material-symbols-outlined text-status-returned text-[18px]">check_circle</span>
<span class="font-label-sm text-[12px] font-medium">Foto capturada! Carregando dados...</span>
</div>
</div>
</div>
</div>
<script>
  (function () {
    const shutter = document.getElementById('shutter-button');
    const toast = document.getElementById('toast-capture');
    const flashBtn = document.getElementById('btn-flash');
    const flashIcon = document.getElementById('flash-icon');
    const flashLabel = document.getElementById('flash-label');
    const reticleBox = document.getElementById('reticle-box');

    // Camera flash toggle states: Auto -> On -> Off
    const flashStates = [
      { mode: 'auto', icon: 'flash_auto', label: 'Auto', active: false },
      { mode: 'on', icon: 'flash_on', label: 'Ligado', active: true },
      { mode: 'off', icon: 'flash_off', label: 'Desl.', active: false }
    ];
    let currentFlashIndex = 0;

    flashBtn?.addEventListener('click', () => {
      currentFlashIndex = (currentFlashIndex + 1) % flashStates.length;
      const state = flashStates[currentFlashIndex];
      flashIcon.textContent = state.icon;
      flashLabel.textContent = state.label;
      
      if (state.active) {
        flashIcon.classList.add('text-primary-container');
        flashIcon.classList.remove('text-text-secondary');
      } else {
        flashIcon.classList.remove('text-primary-container');
        flashIcon.classList.add('text-text-secondary');
      }
    });

    // Shutter Trigger Delight Interaction
    shutter?.addEventListener('click', () => {
      // Reticle pulse confirmation
      reticleBox.classList.add('scale-105', 'border-status-returned');
      
      // Flash simulation screen effect
      const flashScreen = document.createElement('div');
      flashScreen.className = 'absolute inset-0 bg-white z-50 pointer-events-none transition-opacity duration-200 opacity-80';
      document.querySelector('.aspect-\\[9\\/16\\]').appendChild(flashScreen);

      setTimeout(() => {
        flashScreen.classList.remove('opacity-80');
        flashScreen.classList.add('opacity-0');
        setTimeout(() => flashScreen.remove(), 200);
      }, 80);

      // Show affirmative Toast
      if (toast) {
        toast.classList.remove('hidden');
        toast.classList.add('flex');
        setTimeout(() => {
          toast.classList.remove('flex');
          toast.classList.add('hidden');
        }, 2400);
      }

      setTimeout(() => {
        reticleBox.classList.remove('scale-105', 'border-status-returned');
      }, 350);
    });
  })();
</script></main>





</body></html>
