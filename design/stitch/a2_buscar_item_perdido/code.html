<div class="flex items-center gap-3">

<span class="material-symbols-outlined text-text-secondary text-[20px]">expand_more</span>
</button>

          Manhã
        </button>
<button class="filter-chip-period h-9 rounded-full bg-surface text-text-secondary font-label-md text-label-md flex items-center justify-center transition-all active:scale-95" type="button">
          Tarde
        </button>
<button class="filter-chip-period selected h-9 rounded-full bg-primary-container text-text-primary font-label-md text-label-md font-semibold flex items-center justify-center shadow-md active:bg-accent-pressed" type="button">
          Noite
        </button>
</div>
</div>
<!-- Section 2: Location -->
<div class="flex flex-col gap-y-3">

<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-secondary text-[20px]">meeting_room</span>
<div class="flex flex-col">

</div>
</div>
<div class="flex items-center gap-1.5 text-text-secondary group-active:text-text-primary">
<span class="font-label-sm text-label-sm">Alterar</span>
<span class="material-symbols-outlined text-[20px]">unfold_more</span>
</div>
</button>
</div>

</button>

<span class="material-symbols-outlined text-[18px] text-text-primary">headphones</span>
<span>Fone</span>
</button>

</button>

<span>Casaco</span>
</button>
<!-- Mochila -->
<button class="category-chip h-9 px-3.5 rounded-full bg-surface text-text-secondary font-label-md text-label-md flex items-center gap-2 transition-all active:scale-95" type="button">

<button class="category-chip h-9 px-3.5 rounded-full bg-surface text-text-secondary font-label-md text-label-md flex items-center gap-2 transition-all active:scale-95" type="button">

<span>Carregador</span>
</button>

</button>

<span class="material-symbols-outlined text-[18px]">category</span>
<span>Outros</span>
</button>
</div>
</div>

        Limpar filtros
      </button>
<!-- Sticky-ready Primary Action Button -->
<button class="w-full h-[52px] rounded-xl bg-primary-container hover:bg-accent-pressed active:bg-accent-pressed text-text-primary font-label-md text-[16px] font-semibold tracking-wide flex items-center justify-center gap-2 shadow-lg transition-transform active:scale-[0.99]" type="submit">
<span class="material-symbols-outlined text-[20px]">search</span>

</button>

</form>
</div>
<script>
  (function() {
    // Interactive filter toggle behavior for Categories
    const categoryChips = document.querySelectorAll('.category-chip');
    categoryChips.forEach(chip => {
      chip.addEventListener('click', () => {
        categoryChips.forEach(c => {
          c.classList.remove('selected', 'bg-primary-container', 'text-text-primary', 'font-semibold', 'shadow-md');
          c.classList.add('bg-surface', 'text-text-secondary');
          const icon = c.querySelector('.material-symbols-outlined');
          if (icon) icon.classList.remove('text-text-primary');
        });
        chip.classList.remove('bg-surface', 'text-text-secondary');
        chip.classList.add('selected', 'bg-primary-container', 'text-text-primary', 'font-semibold', 'shadow-md');
        const activeIcon = chip.querySelector('.material-symbols-outlined');
        if (activeIcon) activeIcon.classList.add('text-text-primary');
      });
    });

    // Interactive filter toggle behavior for Periods
    const periodChips = document.querySelectorAll('.filter-chip-period');
    periodChips.forEach(chip => {
      chip.addEventListener('click', () => {
        periodChips.forEach(p => {
          p.classList.remove('selected', 'bg-primary-container', 'text-text-primary', 'font-semibold', 'shadow-md');
          p.classList.add('bg-surface', 'text-text-secondary');
        });
        chip.classList.remove('bg-surface', 'text-text-secondary');
        chip.classList.add('selected', 'bg-primary-container', 'text-text-primary', 'font-semibold', 'shadow-md');
      });
    });

    // Clear filters reset
    const clearBtn = document.getElementById('clear-filters-btn');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        // Reset category chips
        categoryChips.forEach(c => {
          c.classList.remove('selected', 'bg-primary-container', 'text-text-primary', 'font-semibold', 'shadow-md');
          c.classList.add('bg-surface', 'text-text-secondary');
          const icon = c.querySelector('.material-symbols-outlined');
          if (icon) icon.classList.remove('text-text-primary');
        });
        // Reset periods
        periodChips.forEach(p => {
          p.classList.remove('selected', 'bg-primary-container', 'text-text-primary', 'font-semibold', 'shadow-md');
          p.classList.add('bg-surface', 'text-text-secondary');
        });
      });
    }
  })();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.4)]" data-active-classes="text-primary-container"><div class="flex items-center justify-around h-16 px-margin"><a aria-current="page" class="flex flex-col items-center justify-center flex-1 h-full py-space-xs transition-colors text-primary-container" data-path="buscar" href="#"><span class="material-symbols-outlined text-[24px]">search</span><span class="font-label-sm text-label-sm mt-space-xs">Buscar</span></a><a class="flex flex-col items-center justify-center flex-1 h-full py-space-xs text-text-secondary hover:text-on-surface transition-colors" data-path="meus-pedidos" href="#"><span class="material-symbols-outlined text-[24px]">inventory_2</span><span class="font-label-sm text-label-sm mt-space-xs">Meus pedidos</span></a></div></nav></body></html>
