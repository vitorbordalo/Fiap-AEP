<!DOCTYPE html><html class="dark" lang="pt-BR" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><title>Achados e Perdidos FIAP</title><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

iner-high": "#2a2a2a", "surface-container-highest": "#353534", "secondary-fixed": "#e4e2e1", "on-surface": "#e5e2e1", "outline": "#ac888b", "surface-elevated": "#242424", "text-primary": "#FFFFFF", "accent-pressed": "#C10F4A", "on-primary-fixed-variant": "#910033", "secondary-fixed-dim": "#c8c6c6", "on-background": "#e5e2e1", "on-primary-fixed": "#400012" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-desktop": "2rem", "gutter-desktop": "1.5rem", "space-3xl": "3rem", "space-2xl": "2rem", "margin": "1.25rem", "space-sm": "0.5rem", "gutter": "1rem", "space-lg": "1rem", "space-md": "0.75rem", "space-xs": "0.25rem", "space-xl": "1.5rem" }, fontFamily: { "label-sm": ["Inter"], "headline-lg": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Inter"] }, fontSize: { "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }] } } } };</script><style>

  </head><body class="bg-background text-on-background font-body-md text-body-md antialiased selection:bg-primary-container selection:text-text-primary"><main class="flex flex-col relative w-full min-h-screen pt-safe pb-safe px-margin bg-background"><div class="flex flex-col w-full min-h-[calc(100vh-theme(spacing.margin)*2)] justify-between py-space-xl px-space-xs">
<!-- Top Branding & Orientation -->
<div class="flex flex-col items-center text-center mt-space-2xl">
<!-- FIAP Wordmark -->
<span class="font-headline-lg text-headline-lg tracking-wider text-text-primary font-bold select-none">
      FIAP
    </span>
<!-- Pill Badge: Área do aluno -->
<div class="inline-flex items-center gap-space-xs bg-surface-container px-space-md py-1 rounded-full mt-space-sm">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
<span class="font-label-sm text-label-sm text-text-secondary font-medium">Área do aluno</span>
</div>
<!-- Main Title -->
<h1 class="font-headline-lg text-headline-lg text-text-primary tracking-tight mt-space-xl mb-space-sm">
      Achados e Perdidos
    </h1>
<!-- Subtitle -->
<p class="font-body-md text-body-md text-text-secondary max-w-[310px] leading-relaxed mx-auto">
      Perdeu algo no campus? Consulte de qualquer lugar se já foi encontrado.
    </p>
</div>
<!-- Central Interaction Flow -->
<div class="w-full max-w-sm mx-auto flex flex-col gap-space-xl my-space-2xl">
<form class="flex flex-col gap-space-lg w-full" novalidate="" onsubmit="event.preventDefault();">
<!-- Institutional Email Field -->
<div class="flex flex-col gap-space-sm">
<label class="font-label-md text-label-md text-text-secondary" for="student-email">
          E-mail institucional
        </label>
<div class="relative flex items-center w-full">
<div class="absolute left-space-lg flex items-center pointer-events-none text-text-disabled">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-[52px] bg-surface text-text-primary placeholder:text-text-disabled pl-12 pr-space-lg rounded-xl font-body-md text-body-md transition-colors duration-150 focus:outline-none focus:border-primary-container focus:bg-surface-elevated border border-border" id="student-email" inputmode="email" name="email" placeholder="rm000000@fiap.com.br" type="email">
</div>
</div>
<!-- Action Section -->
<div class="flex flex-col gap-space-md pt-space-xs">
<button class="w-full h-[52px] bg-primary-container hover:bg-accent-pressed active:bg-accent-pressed text-text-primary font-label-md text-label-md font-semibold rounded-xl flex items-center justify-center gap-space-sm shadow-md transition-all duration-200 active:scale-[0.99] cursor-pointer" id="btn-submit" type="submit">
<span>Receber link de acesso</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-0.5">arrow_forward</span>
</button>
<!-- Frictionless Explainer Helper -->
<div class="flex items-center justify-center gap-space-xs text-text-secondary text-center px-space-xs">
<span class="material-symbols-outlined text-status-returned text-[18px]">verified</span>
<span class="font-label-sm text-label-sm">Enviaremos um link para o seu e-mail. Sem senha.</span>
</div>
</div>
</form>
</div>
<!-- Bottom / Institutional Footer -->
<div class="flex flex-col items-center text-center gap-space-lg pb-space-md">
<!-- Subtle separator bar -->
<div class="w-12 h-1 bg-surface-container rounded-full opacity-60"></div>
<!-- Monitor/Staff Portal Redirect Link -->
<a class="inline-flex items-center gap-1 font-label-md text-label-md text-text-secondary hover:text-text-primary transition-colors cursor-pointer group py-1" href="#login-monitor">
<span>Sou monitor ou funcionário</span>
<span class="material-symbols-outlined text-[16px] transition-transform group-hover:translate-x-0.5">chevron_right</span>
</a>
<!-- Campus Identifier -->
<p class="font-label-sm text-label-sm text-text-disabled tracking-wide">
      FIAP • Campus Aclimação
    </p>
</div>
</div>
<script>
  // Micro-interaction for feedback & validation polish
  const emailInput = document.getElementById('student-email');
  const submitBtn = document.getElementById('btn-submit');

  if (emailInput && submitBtn) {
    emailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitBtn.click();
      }
    });

    submitBtn.addEventListener('click', () => {
      const val = emailInput.value.trim();
      if (!val || !val.includes('@')) {
        emailInput.classList.add('border-error');
        emailInput.focus();
        setTimeout(() => {
          emailInput.classList.remove('border-error');
        }, 1200);
      }
    });
  }
</script></main>
</body></html>
